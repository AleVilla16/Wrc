<title>Il Mio Campionato Rally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: dark broadcast-style UI. Sticky top bar (orange logo tile, condensed wordmark, hamburger menu on phones, inline nav on desktop), then one view at a time: dashboard with hero and stat tiles, calendar of event cards, standings tables, drivers, settings. */
:root {
  --bg: #121419;
  --bar: #1a1c23;
  --surface: #1b1d24;
  --surface-2: #252832;
  --ink: #f5f5f6;
  --ink-2: #8d93a1;
  --line: #2a2d37;
  --accent: #e87c33;
  --accent-ink: #17110b;
  --accent-soft: #3a2517;
  --accent-text: #f08a42;
  --good: #4cc38a;
  --mv-eq: #f2c230;
  --warn: #e0a43a;
  --bad: #ff7a70;
  --focus: #7fb0ff;
  --plate: #ffffff;
  --sky: #2b1c13;
  --ridge-b: #262a34;
  --ridge-f: #1c1f27;
  --s-asfalto: #9fb1ba;
  --s-sterrato: #d9a35a;
  --s-neve: #6fb6ea;
  --s-misto: #b79af0;
  --d-gio: #c28bff;
  --d-ven: #6fa8ff;
  --d-sab: #f2c84b;
  --d-dom: #5fd08a;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'Barlow Condensed', 'Arial Narrow', ui-monospace, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eff0f3;
    --bar: #ffffff;
    --surface: #ffffff;
    --surface-2: #e8eaee;
    --ink: #15171c;
    --ink-2: #5b6170;
    --line: #d8dbe2;
    --accent: #c85a14;
    --accent-ink: #ffffff;
    --accent-soft: #fbe5d5;
    --accent-text: #b4500f;
    --good: #17744a;
    --mv-eq: #a67c00;
    --warn: #8f5a00;
    --bad: #b3261e;
    --focus: #1c64d8;
    --sky: #fbe5d5;
    --ridge-b: #cfd4de;
    --ridge-f: #b9c0cd;
    --s-asfalto: #4f5f68;
    --s-sterrato: #96601c;
    --s-neve: #1f6fa8;
    --s-misto: #7250a8;
    --d-gio: #7250a8;
    --d-ven: #1f6fa8;
    --d-sab: #8f6b00;
    --d-dom: #17744a;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eff0f3;
  --bar: #ffffff;
  --surface: #ffffff;
  --surface-2: #e8eaee;
  --ink: #15171c;
  --ink-2: #5b6170;
  --line: #d8dbe2;
  --accent: #c85a14;
  --accent-ink: #ffffff;
  --accent-soft: #fbe5d5;
  --accent-text: #b4500f;
  --good: #17744a;
  --mv-eq: #a67c00;
  --warn: #8f5a00;
  --bad: #b3261e;
  --focus: #1c64d8;
  --sky: #fbe5d5;
  --ridge-b: #cfd4de;
  --ridge-f: #b9c0cd;
  --s-asfalto: #4f5f68;
  --s-sterrato: #96601c;
  --s-neve: #1f6fa8;
  --s-misto: #7250a8;
    --d-gio: #7250a8;
    --d-ven: #1f6fa8;
    --d-sab: #8f6b00;
    --d-dom: #17744a;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 56px;
}
.wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; padding-top: 20px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; text-wrap: balance; line-height: 1.02; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sa-rows { display: flex; flex-direction: column; gap: 8px; }
.sa-row { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: center; }
.sa-row .btn { min-height: 44px; padding-inline: 12px; }
.mx th, .mx td { padding: 6px 5px; }
.mx th.ev-h { text-align: center; padding-block: 6px 2px; }
.mx th.ev-h span { display: block; font-size: 14px; letter-spacing: .06em; }
.mx th.sub { text-align: center; padding-block: 2px 6px; font-size: 12px; letter-spacing: .08em; }
.mx td.pc { text-align: center; min-width: 30px; font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.mx td.num { text-align: center; min-width: 32px; font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.mx td.gap { color: var(--ink-2); font-size: 15px; font-weight: 600; white-space: nowrap; }
.mx th.gap-h { font-size: 11px; letter-spacing: .04em; text-align: center; }
.mx td.num.pts { text-align: right; font-size: 21px; font-weight: 700; padding-inline: 10px; }
.mx td.pc.p1 { background: #f2c230; color: #1a1405; }
.mx td.pc.p2 { background: #b8bcc6; color: #15171c; }
.mx td.pc.p3 { background: #a0653a; color: #fff; }
.mx td.pc.px { background: #d93a2f; color: #fff; }
.mx thead th { font-size: 12px; letter-spacing: .08em; }
.mx th.ev-h span { font-size: 13px; }
.mx thead th.c-pos { font-size: 11px; letter-spacing: .04em; text-align: center; }
.mx .c-pos { width: 34px; min-width: 34px; max-width: 34px; font-size: 18px; padding-inline: 4px; }
.mx .c-drv { left: 34px; min-width: 0; max-width: 128px; white-space: normal; }
.mx .drv { gap: 6px; }
.mx .drv .bar { min-height: 28px; }
.mx .drv b { font-size: 14px; line-height: 1.15; display: block; }
.mx .drv small { font-size: 11px; line-height: 1.2; white-space: normal; overflow-wrap: anywhere; }
.mx img.tlogo { height: 18px; max-width: 28px; min-width: 18px; }
.mx .tlogo.ph { width: 18px; height: 18px; font-size: 12px; }
@media (min-width: 640px) { .mx .c-drv { max-width: 220px; } .mx .drv b { font-size: 16px; } .mx img.tlogo { height: 26px; max-width: 46px; } }
.flag.mini { width: 26px; height: 17px; margin: 0 auto 2px; }
.yt-block { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.yt-block .field { flex: 1 1 260px; }
.yt-block a.btn { text-decoration: none; }
.arcview :disabled { opacity: 1; cursor: default; }
.drvbtn { background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; display: flex; align-items: center; border-radius: 8px; }
.drvbtn:hover b { color: var(--accent-text); text-decoration: underline; }
.stgs { display: flex; flex-direction: column; gap: 10px; }
.stg { border: 1px solid var(--line, rgba(128,128,128,.3)); border-radius: 10px; padding: 10px 12px; }
.stg-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stg-rec { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 8px; }
.stg-rec .rt { font: 800 28px 'Barlow Condensed', sans-serif; color: var(--accent-text); }
.stg-rec .ry { font-weight: 700; color: var(--muted, #98a2b3); }
.stg-dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 14px; margin: 0; }
.stg-dl dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted, #98a2b3); }
.stg-dl dd { margin: 0; font-weight: 600; }
.chips-pts { display: flex; flex-wrap: wrap; gap: 6px; }
.ptchip { display: inline-flex; flex-direction: column; align-items: center; min-width: 36px; padding: 2px 8px; border-radius: 8px; background: var(--surface-2, rgba(128,128,128,.15)); border: 1px solid var(--line, rgba(128,128,128,.3)); }
.ptchip small { font-size: 11px; color: var(--muted, #98a2b3); }
.ptchip b { font: 700 18px 'Barlow Condensed', sans-serif; }
.flag.pf.nf { width: 24px; height: 16px; flex: none; border-radius: 2px; box-shadow: 0 0 0 1px rgba(128,128,128,.4); }
.pcard { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pcard .ph { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; background: var(--surface-2, #2a2f36); border: 3px solid var(--c, #7b8794); flex: none; display: flex; align-items: center; justify-content: center; font: 700 34px 'Barlow Condensed', sans-serif; color: var(--muted, #98a2b3); overflow: hidden; }
.pcard .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pcard .pnum { font: 800 44px/1 'Barlow Condensed', sans-serif; color: var(--c, #7b8794); }
.pcard .pmeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flag.pf { width: 36px; height: 24px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(128,128,128,.4); }
.evlist { display: flex; flex-direction: column; gap: 8px; }
details.evstat { background: var(--surface, #1b1f24); border: 1px solid var(--line, rgba(128,128,128,.3)); border-radius: 10px; }
details.evstat > summary { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; list-style: none; min-height: 48px; }
details.evstat > summary::-webkit-details-marker { display: none; }
details.evstat > summary .en { flex: 1; font-weight: 700; font-size: 17px; }
details.evstat > summary .bp { font: 800 24px 'Barlow Condensed', sans-serif; min-width: 48px; text-align: center; padding: 2px 10px; border-radius: 8px; }
details.evstat > summary .bp.p1 { background: #f2c230; color: #1a1405; }
details.evstat > summary .bp.p2 { background: #c3c9d1; color: #14171a; }
details.evstat > summary .bp.p3 { background: #cd7f32; color: #1a0f05; }
details.evstat > summary::after { content: '▾'; color: var(--muted, #98a2b3); }
details.evstat[open] > summary::after { content: '▴'; }
details.evstat .tablewrap { padding: 0 8px 10px; }
.tiles.stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tiles.stats .tile .val { font-size: 40px; }
.tiles.stats .tile .lbl { font-size: 13px; }
.chip-st.sv-lunga { background: color-mix(in srgb, var(--bad) 24%, var(--surface-2)); color: var(--bad); }
.chip-st.on.sv-lunga { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -5px 0 var(--bad); }
.gm { display: flex; flex-direction: column; gap: 12px; }
.gm-stock { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.gm-stock-box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; }
.gm-row { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.gm-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
.gm-km { font-size: 15px; color: var(--ink-2); }
.gm-km b { color: var(--accent-text); }
.gm-sum { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
.gm-sum li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.gm-sum li.over { color: var(--bad); }
.part-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; }
.item.eqv { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 560px) { .item.eqv { grid-template-columns: 1fr; } }
.tmwrap { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.tmwrap .btn { min-height: 40px; padding-inline: 10px; }
.kmtot { color: var(--accent-text); font-weight: 600; }
.filebtn { position: relative; overflow: hidden; }
.filebtn .filein { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 0; }
.filebtn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mut { color: var(--ink-2); }

/* Top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.bar-in { max-width: 980px; margin-inline: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 0 16px; padding-block: 8px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; }
.logo { flex: none; width: 42px; height: 42px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.05; text-transform: uppercase; overflow-wrap: break-word; }
.burger { order: 2; flex: none; width: 46px; height: 46px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--ink-2); cursor: pointer; }
.burger:hover { color: var(--ink); }
.menu { order: 3; flex-basis: 100%; display: none; flex-direction: column; gap: 6px; padding-block: 6px 14px; }
.menu.open { display: flex; }
.mi { background: none; border: 0; border-radius: 9px; padding: 14px 16px; text-align: left; cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 21px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
.mi:hover { color: var(--ink); background: var(--surface-2); }
.mi[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (min-width: 820px) {
  .burger { display: none; }
  .menu { display: flex; flex-basis: auto; flex-direction: row; order: 2; padding: 0; gap: 4px; }
  .mi { padding: 10px 14px; font-size: 19px; }
  .brand { flex: 1 1 280px; min-width: 280px; }
  .menu { margin-left: auto; }
}

.top { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent-text); }
.top h1 { font-size: clamp(38px, 8vw, 60px); }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--sky) 0%, var(--surface) 100%); min-height: 260px; display: flex; }
.hero.has-img { background-size: cover; background-position: center; border-color: transparent; }
.hero.has-img .hero-art { display: none; }
.hero.has-img h1, .hero.has-img .hero-sub { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.hero.has-img .eyebrow { color: #ffa662; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
.hero-prev { display: block; width: 100%; max-width: 420px; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 12px; }
.hero-art { position: absolute; inset: auto 0 0 0; width: 100%; height: 62%; }
.hero-art .sun { fill: var(--accent); opacity: .6; }
.hero-art .ridge-b { fill: var(--ridge-b); }
.hero-art .ridge-f { fill: var(--ridge-f); }
.hero-in { position: relative; display: flex; flex-direction: column; gap: 10px; padding: 26px 22px 70px; max-width: 640px; }
.hero h1 { font-size: clamp(38px, 8vw, 72px); overflow-wrap: anywhere; }
.hero-sub { font-size: 18px; color: var(--ink-2); }
.strip { display: flex; gap: 4px; }
.strip i { flex: 1; min-width: 6px; height: 8px; border-radius: 2px; background: var(--surface-2); }
.strip i.done { background: var(--accent); }
.strip i.next { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .lbl { font-family: var(--f-display); font-weight: 500; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }
.tile .val { font-family: var(--f-display); font-weight: 700; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .val.sm { font-size: 30px; line-height: 1.1; padding-block: 11px 0; text-transform: uppercase; }
.tile .sub { font-size: 14px; color: var(--accent-text); font-weight: 500; min-height: 1.4em; }

/* Common blocks */
.view { display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.section-title { font-size: 30px; letter-spacing: .01em; }
.section-head { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; }
.hint { font-size: 14px; color: var(--ink-2); max-width: 65ch; }
.empty { border: 1px dashed var(--line); border-radius: 16px; padding: 28px 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; background: var(--surface); }
.empty h3 { font-size: 30px; }
.empty p { max-width: 55ch; color: var(--ink-2); }
.banner { border-left: 4px solid var(--warn); background: var(--surface); padding: 10px 14px; font-size: 14px; color: var(--ink-2); border-radius: 0 8px 8px 0; }
.foot { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); padding-top: 4px; }
.foot i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--f-display); font-weight: 600; font-size: 18px; letter-spacing: .05em; text-transform: uppercase; min-height: 46px; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--bg); font-weight: 700; }
.btn.small { padding: 4px 12px; min-height: 36px; font-size: 16px; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }

/* Forms */
form.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field .lbl, .field label, legend { font-family: var(--f-display); font-size: 15px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); padding: 0; }
input[type="text"], input[type="number"], input[type="url"], input[type="date"], input[type="time"], select, textarea { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 44px; }
input:focus-visible, select:focus-visible { outline-offset: 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.span-all { grid-column: 1 / -1; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { position: relative; display: inline-block; cursor: pointer; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw span.dot { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw input:checked + span.dot { box-shadow: 0 0 0 3px var(--ink); }
.sw input:focus-visible + span.dot { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Next event card */
.next-card { display: grid; grid-template-columns: auto 1fr auto; gap: 12px 20px; align-items: center; background: var(--surface); border: 1px solid var(--accent); border-radius: 16px; padding: 18px; }
.next-card h3 { font-size: clamp(28px, 6vw, 40px); overflow-wrap: anywhere; }
.next-card .meta { font-size: 15px; color: var(--ink-2); }
.next-card .when { font-family: var(--f-display); font-size: 17px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

  // Tappe già corse nello stesso evento (stesso nome) in questa stagione e in quelle archiviate, non ancora presenti in r

  // Evento in corso (altrimenti l'ultimo concluso): primi 5 della classifica totale con i punti

  function evFlag(r) {

  function mxHead(sr, who) {

  // Due celle per evento: posizione (colorata) e punti. p: numero, 'X' ritirato, undefined non partecipa.

  // Tabelle a matrice (piloti + costruttori), usate in Classifiche e nello Storico
  function matrixTables(s, sr, rows) {
    var out = '', ck = champKeyOf(s);

    var body = rows.map(function (row, ri) {

      }).join('');

    out += '<p class="hint">Pos è la posizione finale nell’evento (oro 1°, argento 2°, bronzo 3°, X ritirato); PT sono i punti dell’evento, bonus compresi (Power Stage, Shakedown, Sabato, Domenica). TOT è il totale; «Dal 1°» e «Dal prec.» sono i punti di distacco dal primo e dal pilota davanti. In parità di punti conta il maggior numero di vittorie, poi di secondi posti e così via.</p>';
    out += '<p class="hint">' + sr.map(function (r, i) { return 'E' + (i + 1) + ' ' + esc(shortName(r)); }).join(' · ') + '</p>';

      var per = sr.map(function (r) { return hasResults(s, r.id) ? teamEventPts(s, r) : null; });
      var teamTotals = teams.map(function (x) { return x.total; }), tm = teamMoves(s, teams);

        return '<tr><td class="c-pos">' + posCell(i + 1, tm ? tm[t.team] : undefined) + '</td><td class="c-drv"><button type="button" class="drvbtn" data-action="stat-open" data-type="team" data-key="' + esc(String(t.team).trim().toLowerCase()) + '" data-champ="' + esc(ck) + '" aria-label="Statistiche di ' + esc(t.team) + '"><div class="drv" style="--c:' + esc(tColor[t.team] || '#7b8794') + '"><span class="bar"></span>' + logoHtml(t.team) + '<div><b>' + esc(t.team) + '</b><small>' + esc(t.drivers.join(', ')) + '</small></div></div></button></td>' +

        '<p class="hint">Per ogni evento la squadra prende i punti dei suoi 2 piloti migliori (quelli con più punti in quell’evento). Pos è il posto della squadra in quell’evento (X se tutti i suoi piloti si sono ritirati). I distacchi sono in punti dal primo e dalla squadra davanti.</p></section>';

  function viewStandings(s) {

    }

    var out = '<div class="section-head"><h2 class="section-title">Classifica piloti</h2></div>';

    if (!anyDone) {
      out += '<div class="empty"><h3>Classifica in attesa del primo evento</h3><p>Apri Calendario, premi «Gestisci» su un evento e inserisci i tempi di tutte le tappe: a evento completo la classifica e i punti si calcolano da soli.</p><button class="btn primary" type="button" data-action="tab" data-tab="calendario">Vai al calendario</button></div>';

      (second ? ' · +' + (lead.total - second.total) + ' su ' + esc(second.d.name) : '') + '</span></div>';

      '<div class="field"><label for="lg-mail">Email</label><input type="email" id="lg-mail" autocomplete="username" required></div>' +
      '<div class="field"><label for="lg-pw">Password</label><input type="password" id="lg-pw" autocomplete="current-password" required></div>' +
      '<p class="warn" id="lg-msg" role="alert">' + esc(msg || '') + '</p>' +
      '<div class="actions"><button class="btn primary" type="submit">Accedi</button><button class="btn ghost" type="button" id="lg-skip">Continua senza accesso</button></div></form>';
    document.body.appendChild(el);
    el.querySelector('#lg-mail').focus();
    el.querySelector('#lg-skip').addEventListener('click', function () { cloud.skip = true; try { localStorage.setItem('rally-sb-skip', '1'); } catch (e) { /* ignora */ } el.remove(); setStatus('Salvato in questo browser'); });
    el.querySelector('form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var mail = el.querySelector('#lg-mail').value.trim(), pw = el.querySelector('#lg-pw').value, m = el.querySelector('#lg-msg');
      m.textContent = 'Accesso in corso…';
      fetch(SB_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: mail, password: pw }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || 'Accesso non riuscito'); return j; }); })
        .then(function (j) {
          cloud.session = null; setSession(j);
          try { localStorage.removeItem('rally-sb-skip'); } catch (e) { /* ignora */ }
          cloud.skip = false; el.remove(); if (ui.tab === 'impostazioni') render();
          pullNow(true);
        })
        .catch(function (e) { m.textContent = /invalid login/i.test(String(e.message)) ? 'Email o password non corrette.' : (e instanceof TypeError ? 'Non riesco a collegarmi: controlla la connessione.' : String(e.message)); });
    });
  }
  function syncSection() {
    var on = !!cloud.session;
    return '<section class="card"><h3 class="section-title" style="margin-bottom:6px">Sincronizzazione</h3><p class="hint" style="margin-bottom:12px">' +
      (on ? 'Collegato come <b>' + esc(cloud.session.email || '') + '</b>. I dati si salvano su Supabase e si aggiornano su tutti i tuoi dispositivi. Stato: <b>' + esc(ui.status || '') + '</b>.' : 'Non sei collegato: i dati restano solo in questo browser. Accedi per averli anche sugli altri dispositivi.') + '</p>' +
      '<div class="actions">' + (on ? '<button class="btn" type="button" data-action="sb-sync">Sincronizza ora</button><button class="btn ghost" type="button" data-action="sb-logout">Esci</button>' : '<button class="btn primary" type="button" data-action="sb-login-open">Accedi</button>') + '</div></section>';
  }
  function cloudInit() {
    try { cloud.meta = Object.assign({ lastSync: '', dirty: false }, JSON.parse(localStorage.getItem('rally-sb-meta') || '{}')); } catch (e) { /* ignora */ }
    try { cloud.session = JSON.parse(localStorage.getItem('rally-sb-session') || 'null'); } catch (e) { cloud.session = null; }
    try { cloud.skip = localStorage.getItem('rally-sb-skip') === '1'; } catch (e) { /* ignora */ }
    if (cloud.session) { setStatus('Sincronizzo…'); pullNow(); }
    else if (!cloud.skip) showLogin('');
    document.addEventListener('visibilitychange', function () { if (!document.hidden && cloud.session && Date.now() - cloud.lastPull > 8000 && !cloud.meta.dirty) pullNow(); });
    setInterval(function () { if (!document.hidden && cloud.session && !cloud.meta.dirty && !cloud.busy) pullNow(); }, 60000);
  }

  init();
  detectScan();
  cloudInit();
})();
</script>
